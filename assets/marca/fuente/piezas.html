<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root { --cafe: #4A2018; --ladrillo: #BA4036; --dorado: #E3A33B; --crema: #FBF3E8; --vino: #8A1C2B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; font-family: 'Baloo 2', Carlito, Calibri, sans-serif; }
  body.crema { background: var(--crema); }
  .pieza { display: inline-block; padding: 80px; }

  /* 1. Logo con Andi: pegatina blanca alrededor de los dos */
  .logo-andi { position: relative; width: 1500px; height: 1180px; }
  .logo-andi .pegatina { position: absolute; inset: 0; filter: drop-shadow(0 18px 24px rgba(74, 32, 24, .22)); }
  .logo-andi .contorno { position: absolute; inset: 0;
    filter: drop-shadow(0 0 0 #fff) drop-shadow(14px 0 0 #fff) drop-shadow(-14px 0 0 #fff) drop-shadow(0 14px 0 #fff) drop-shadow(0 -14px 0 #fff) drop-shadow(10px 10px 0 #fff) drop-shadow(-10px 10px 0 #fff) drop-shadow(10px -10px 0 #fff) drop-shadow(-10px -10px 0 #fff); }
  .logo-andi img.andi { position: absolute; left: 50%; top: 0; width: 820px; transform: translateX(-50%); }
  .logo-andi img.logo { position: absolute; left: 50%; top: 640px; width: 1420px; transform: translateX(-50%); }

  /* 2. Frase: globo crema con rayitos dorados */
  .frase { position: relative; display: inline-flex; align-items: center; gap: 36px; }
  .frase .globo { background: #FFF6EA; border-radius: 70px; padding: 48px 86px 56px; text-align: center; box-shadow: 0 16px 0 rgba(74, 32, 24, .10), 0 24px 36px rgba(74, 32, 24, .14); }
  .frase .globo p { margin: 0; font-weight: 800; font-size: 108px; line-height: 1.08; letter-spacing: -1px; color: var(--cafe); }
  .frase .globo p + p { color: var(--ladrillo); }
  .frase svg { width: 150px; height: 220px; flex: none; overflow: visible; }
  .frase svg.der { transform: scaleX(-1); }
</style>
</head>
<body>
  <div class="pieza" id="logo-andi">
    <div class="logo-andi">
      <div class="pegatina"><div class="contorno">
        <img class="andi" src="andi-envase.png" alt="Andi" />
        <img class="logo" src="logo_color.png" alt="AndiBite" />
      </div></div>
    </div>
  </div>

  <div class="pieza" id="frase">
    <div class="frase">
      <svg viewBox="0 0 150 220" aria-hidden="true"><g stroke="#E3A33B" stroke-width="18" stroke-linecap="round" fill="none">
        <path d="M110 40 L40 20" /><path d="M118 110 L30 110" /><path d="M110 180 L40 200" /></g></svg>
      <div class="globo"><p>Dulce para ellos.</p><p>Tranquilidad para ti.</p></div>
      <svg class="der" viewBox="0 0 150 220" aria-hidden="true"><g stroke="#E3A33B" stroke-width="18" stroke-linecap="round" fill="none">
        <path d="M110 40 L40 20" /><path d="M118 110 L30 110" /><path d="M110 180 L40 200" /></g></svg>
    </div>
  </div>
</body>
</html>
